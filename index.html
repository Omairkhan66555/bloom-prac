<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom Filter Practical</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:0 18px;color:#222;line-height:1.5}
h1{font-size:26px;margin-bottom:6px}p{color:#444}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
button,.download{border:1px solid #bbb;background:#f3f4f6;color:#111;border-radius:6px;padding:9px 13px;font-size:14px;text-decoration:none;cursor:pointer}
button:hover,.download:hover{background:#e5e7eb}
pre{background:#f5f5f5;border:1px solid #ddd;border-radius:6px;padding:14px;overflow:auto;white-space:pre;font:13px/1.45 Consolas,monospace}
h2{font-size:19px;margin-top:25px}
</style>
</head>
<body>
<h1>Bloom Filter Practical</h1>
<p><strong>Problem Statement:</strong> Implement a Bloom Filter to test membership in a dataset using any programming language.</p>
<div class="actions">
<button id="copyCode">Copy Code</button>
<a class="download" href="/bloom-filter.txt" download>Download Code</a>
<a class="download" href="/Bloom-BDA-practical.docx" download>Download Document</a>
</div>
<h2>Python Code</h2>
<pre><code id="source">Loading code…</code></pre>
<script>
async function loadCode(){
 const codeElement=document.getElementById("source");
 try{
  const response=await fetch("/bloom-filter.txt");
  if(!response.ok)throw new Error("Code file unavailable");
  codeElement.textContent=await response.text();
 }catch(error){
  codeElement.textContent="Could not load code. Make sure bloom-filter.txt is in the same GitHub repository root.";
 }
}
document.getElementById("copyCode").addEventListener("click",async()=>{
 const code=document.getElementById("source").textContent;
 try{await navigator.clipboard.writeText(code);alert("Code copied!");}
 catch(error){
  const area=document.createElement("textarea");area.value=code;document.body.appendChild(area);
  area.select();document.execCommand("copy");area.remove();alert("Code copied!");
 }
});
loadCode();
</script>
</body>
</html>
